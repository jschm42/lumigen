{% for item in session_items %}
  {% include 'fragments/session_item.html' %}
{% endfor %}

{% if session_has_more %}
  <div
    class="col-span-full mt-2 flex justify-center text-xs text-slate-400 dark:text-slate-500"
    hx-get="/sessions/list-fragment?offset={{ session_next_offset }}&limit=10&prev_category={{ session_next_prev_category | urlencode }}&active_conversation={{ active_conversation | urlencode }}&workspace_view={{ workspace_view | urlencode }}&artbook_filter={{ artbook_filter | urlencode }}&artbook_name_query={{ artbook_name_query | urlencode }}"
    hx-trigger="intersect once root:#session-list threshold:0.85"
    hx-swap="outerHTML"
  >
    Loading more artbooks...
  </div>
{% endif %}
