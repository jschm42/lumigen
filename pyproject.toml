[project]
name = "lumigen"
# Keep in sync with the VERSION file (scripts/update_version.py updates both).
version = "0.6.0-beta"
description = "Local-first AI image studio for image generation, gallery management, metadata sidecars, and optional upscaling."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.6.1",
    "pillow>=11.0.0",
    "httpx>=0.28.0",
    "cryptography>=42.0.0",
    "itsdangerous>=2.2.0",
    "huggingface_hub>=0.24.0",
]

[project.scripts]
lumigen = "app.cli:start"
lumigen-migrate = "app.cli:migrate"

[tool.poetry]
# Package mode is required so Poetry installs the [project.scripts] entry points.
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
pytest-asyncio = ">=0.24.0"
pytest-cov = ">=5.0.0"
ruff = ">=0.6.0"
djlint = ">=1.34.0"
pre-commit = ">=4.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.djlint]
profile = "jinja"
ignore = "H006,H014,H021,H023,H030,H031,J018,T002,T003,T028"
indent = 2
